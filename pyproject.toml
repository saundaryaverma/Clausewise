[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausewise"
version = "0.1.0"
description = "Find the clauses that matter in a contract, cite them, and know when they aren't there."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
clausewise = "clausewise.cli:main"

[tool.setuptools]
packages = ["clausewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["clausewise"]
omit = ["clausewise/__main__.py"]
